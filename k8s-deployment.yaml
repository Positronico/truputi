apiVersion: apps/v1
kind: Deployment
metadata:
  name: truputi-server
  labels:
    app: truputi-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: truputi-server
  template:
    metadata:
      labels:
        app: truputi-server
    spec:
      containers:
      - name: truputi-server
        image: ghcr.io/positronico/truputi:latest
        ports:
        - containerPort: 32201
          name: truputi
          protocol: TCP
        env:
        - name: TRUPUTI_PSK
          valueFrom:
            secretKeyRef:
              name: truputi-secret
              key: psk
        - name: TRUPUTI_PORT
          value: "32201"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "1000m"
        livenessProbe:
          tcpSocket:
            port: 32201
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 32201
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: truputi-server
  labels:
    app: truputi-server
spec:
  type: LoadBalancer
  selector:
    app: truputi-server
  ports:
  - port: 32201
    targetPort: 32201
    protocol: TCP
    name: truputi
  sessionAffinity: None
---
apiVersion: v1
kind: Secret
metadata:
  name: truputi-secret
type: Opaque
stringData:
  psk: "change-me-to-your-secret-key"
